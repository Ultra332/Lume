name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ferramentas C
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Compilar com os warnings do projeto
        run: make clean && make
      - name: Executar todas as suítes
        run: make test

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ferramentas C
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Executar as suítes com AddressSanitizer e UBSan
        run: make sanitize

