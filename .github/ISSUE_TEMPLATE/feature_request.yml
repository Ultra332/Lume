name: Propor uma melhoria
description: Sugira uma melhoria com motivação educacional.
title: "[Proposta]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Que dificuldade concreta esta proposta resolve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Exemplo de uso
      description: Mostre como a ideia apareceria para quem usa a Lume.
    validations:
      required: true
  - type: textarea
    id: learning
    attributes:
      label: Por que isso ajuda a aprender?
      description: Explique o benefício educacional e alternativas que você considerou.
